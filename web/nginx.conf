server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 200k;

  # Vraie IP du client quand Caddy est devant (réseaux Docker privés uniquement)
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Appels API transmis au container de l'API
  location /api/ {
    proxy_pass http://api:3000;
    # $http_host garde le port : l'API compare Host et Origin (protection CSRF)
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Envoi du logo des documents (1 Mo maximum côté API) : seule exception à la limite de 200 Ko
  location = /api/documents/logo {
    client_max_body_size 2m;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Fichiers générés par Vite (noms avec hash) : cache long
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Application Vue : toutes les autres URL renvoient index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
