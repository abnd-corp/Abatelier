# Base commune, durcie pour la production.
#   Développement : docker compose up               (ajoute compose.override.yaml automatiquement)
#   Production    : docker compose -f compose.yaml -f compose.prod.yaml up -d --build
name: abatelier

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    <<: *hardening
    image: postgres:17-alpine
    # Le script de démarrage de Postgres a besoin de ces droits pour préparer son dossier
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: abatelier
      POSTGRES_USER: abatelier
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs: [/var/run/postgresql, /tmp]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abatelier -d abatelier"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *hardening
    build: { context: ./api, target: prod }
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PASSWORD_FILE: /run/secrets/db_password
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # Avis Google du site : sans clé, il affiche seulement un lien (clé dans secrets/google_places_api_key.txt)
      GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID:-}
      # E-mails : sans SMTP_HOST ni MAIL_FROM, rien n'est envoyé (mot de passe dans secrets/smtp_password.txt)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_ALERT_TO: ${MAIL_ALERT_TO:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      GOOGLE_PLACES_API_KEY_FILE: /run/secrets/google_places_api_key
      # Paiement en ligne de la boutique : none (fermé) ou stripe (clés dans secrets/stripe_secret_key.txt et stripe_webhook_secret.txt)
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      ADMIN_IDENTIFIANT: ${ADMIN_IDENTIFIANT:-admin}
      ADMIN_NOM: ${ADMIN_NOM:-Administrateur}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      IDLE_TIMEOUT_HOURS: ${IDLE_TIMEOUT_HOURS:-12}
    secrets: [db_password, admin_password, google_places_api_key, smtp_password, stripe_secret_key, stripe_webhook_secret]
    tmpfs: [/tmp]
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    <<: *hardening
    build: { context: ./web, target: prod }
    depends_on:
      api: { condition: service_healthy }
    tmpfs: [/tmp, /var/cache/nginx]
    networks: [frontend]

  # Sauvegarde quotidienne de la base (voir scripts/backup/backup.sh et « make help »)
  backup:
    <<: *hardening
    image: postgres:17-alpine
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/opt/backup/backup.sh"]
    command: ["loop"]
    environment:
      TZ: Europe/Paris
      PGHOST: db
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
    secrets: [db_password]
    volumes:
      - ./scripts/backup:/opt/backup:ro
      - backups:/backups
    tmpfs: [/tmp]
    networks: [backend]
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/backup/backup.sh", "health"]
      interval: 1m
      start_period: 1m
      start_interval: 3s

secrets:
  db_password:
    file: ./secrets/db_password.txt
  admin_password:
    file: ./secrets/admin_password.txt
  google_places_api_key:
    file: ./secrets/google_places_api_key.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret.txt

networks:
  # La base n'est joignable que par l'API, et n'a pas accès à Internet
  backend:
    internal: true
  frontend: {}

volumes:
  pgdata:
  backups:
