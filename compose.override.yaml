# Environnement de développement, chargé automatiquement par « docker compose up ».
# Le code est monté depuis la machine : l'API et le front se rechargent à chaque modification.
services:
  db:
    networks: [backend, devdb]
    # Base accessible depuis la machine (DBeaver, psql…), jamais depuis le réseau
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  # Boîte de réception de test : tous les e-mails envoyés par l'application s'y arrêtent, rien ne part pour de vrai.
  # À ouvrir sur http://localhost:8025 (« make mails »)
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [frontend]

  api:
    build: { target: dev }
    read_only: false
    depends_on:
      mailpit: { condition: service_started }
    environment:
      NODE_ENV: development
      # E-mails : par défaut la boîte de test Mailpit (http://localhost:8025). Pour de vrais envois (Gmail, etc.), renseigner SMTP_* et MAIL_* dans .env
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-Alu Pliage Service <contact@aps.test>}
      MAIL_ALERT_TO: ${MAIL_ALERT_TO:-direction@aps.test}
      # Faux paiement en ligne pour essayer la boutique. Pour essayer Stripe en mode test : PAYMENT_PROVIDER=stripe dans .env (voir docs/stripe-test.md)
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulation}
    volumes:
      - ./api/src:/app/src:ro
      - ./api/drizzle:/app/drizzle:ro

  web:
    build: { target: dev }
    read_only: false
    environment:
      VITE_API_TARGET: http://api:3000
    volumes:
      - ./web/src:/app/src:ro
      - ./web/public:/app/public:ro
      - ./web/index.html:/app/index.html:ro
      - ./web/vite.config.ts:/app/vite.config.ts:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"

networks:
  devdb: {}
