# Production et staging : Caddy devant le site, HTTPS automatique (Let's Encrypt).
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
services:
  api:
    environment:
      COOKIE_SECURE: "true"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN:?définir DOMAIN dans .env (ex. atelier.mon-domaine.fr)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: [/tmp]
    networks: [frontend]

volumes:
  caddy_data:
  caddy_config:
