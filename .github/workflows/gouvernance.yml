# Contrôles communs de l'organisation (voir docs/adr/0001-ecarts-a-la-charte.md).
# Seules les PR vers dev sont contrôlées : les promotions vers staging et main
# portent un titre libre (écart assumé à R5).
name: Gouvernance

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  controle:
    name: Contrôle des PR
    uses: abnd-corp/gouvernance/.github/workflows/controle-pr.yml@9993a802319c0cfc9489b20f172dea72ccbb0d7c # gouvernance, 23 octobre 2026
