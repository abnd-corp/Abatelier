# Contrôles communs de l'organisation (voir docs/adr/0001-ecarts-a-la-charte.md).
# Seules les PR vers dev sont contrôlées : les promotions vers staging et main
# portent un titre libre (écart assumé à R5).
name: Gouvernance

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  controle:
    name: Contrôle des PR
    uses: abnd-corp/gouvernance/.github/workflows/controle-pr.yml@66eac40c76d2fa667555f2987f1836e598db6a26 # gouvernance, 25 octobre 2026
