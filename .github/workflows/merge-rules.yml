name: Règles de merge

# Chemin imposé : feature/** (ou dependabot/**) → dev → staging → main.
# Ce contrôle est obligatoire pour merger (règles de branche GitHub, qui attendent
# le nom « Branche source autorisée / Branche source autorisée » d'un workflow partagé).
on:
  pull_request:
    branches: [dev, staging, main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  source:
    name: Branche source autorisée
    uses: abnd-corp/gouvernance/.github/workflows/branche-source.yml@ee24d45972d9de0fda9256e93c4f68065560c7d1 # gouvernance, 26 octobre 2026
