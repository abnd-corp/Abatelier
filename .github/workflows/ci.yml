name: CI

on:
  pull_request:
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Vérification des types (code et tests)
        run: npm run typecheck
      - name: Compilation
        run: npm run build
      - name: Migrations à jour avec le schéma
        run: |
          npx drizzle-kit generate --name verification
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::api/src/db/schema.ts a changé sans migration. Lancez « cd api && npm run db:generate » et commitez le fichier SQL."
            exit 1
          fi

  api-tests:
    name: Tests API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patalu
          POSTGRES_PASSWORD: test
          POSTGRES_DB: patalu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U patalu -d patalu_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://patalu:test@localhost:5432/patalu_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    name: Front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types et build
        run: npm run build

  web-tests:
    name: Tests front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tests des composants
        run: npm test

  e2e:
    name: E2E (Chromium + Firefox)
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -p patalu-e2e -f compose.yaml -f compose.e2e.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Secrets jetables
        run: ./scripts/init-secrets.sh
      - name: Stack de production jetable
        run: $COMPOSE up -d --build --wait
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium firefox
          npx playwright test
      - name: Logs des containers
        if: failure()
        run: $COMPOSE logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: e2e/playwright-report
          retention-days: 7

  security:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Failles dans les dépendances
        run: |
          status=0
          for d in api web e2e; do
            echo "::group::$d"
            # Production : aucune faille haute ou critique tolérée. Outils de dev : aucune critique.
            (cd $d && npm audit --omit=dev --audit-level=high && npm audit --audit-level=critical) || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Aucun secret dans l'historique Git
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner -v
