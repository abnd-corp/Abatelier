name: CI

on:
  pull_request:
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter et mise en forme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: ESLint et Prettier
        run: npm run lint
      - name: Schémas BPMN (passerelles, flèches qui ne se superposent pas ni ne traversent une étape)
        run: BPMN_SORTIE="$RUNNER_TEMP/bpmn" node scripts/bpmn/generer.mjs

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Vérification des types (code et tests)
        run: npm run typecheck
      - name: Compilation
        run: npm run build
      - name: Migrations à jour avec le schéma
        run: |
          npx drizzle-kit generate --name verification
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::api/src/db/schema.ts a changé sans migration. Lancez « cd api && npm run db:generate » et commitez le fichier SQL."
            exit 1
          fi

  api-tests:
    name: Tests API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: abatelier
          POSTGRES_PASSWORD: test
          POSTGRES_DB: abatelier_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U abatelier -d abatelier_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://abatelier:test@localhost:5432/abatelier_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    name: Front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types et build
        run: npm run build

  web-tests:
    name: Tests front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tests des composants
        run: npm test

  e2e-selection:
    name: E2E (sélection)
    runs-on: ubuntu-latest
    outputs:
      fichiers: ${{ steps.choix.outputs.fichiers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Groupes touchés par la PR (suite complète vers staging, main et après un merge)
        id: choix
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$BASE" != "staging" ] && [ "$BASE" != "main" ]; then
            fichiers=$(cd e2e && node select.mjs --diff "origin/$BASE")
          else
            fichiers=tout
          fi
          echo "Tests e2e : $fichiers"
          echo "fichiers=$fichiers" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: E2E partie ${{ matrix.partie }}/3
    needs: e2e-selection
    if: needs.e2e-selection.outputs.fichiers != 'rien'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partie: [1, 2, 3]
    env:
      COMPOSE: docker compose -p abatelier-e2e -f compose.yaml -f compose.e2e.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Secrets jetables
        run: ./scripts/init-secrets.sh
      - name: Stack de production jetable
        run: $COMPOSE up -d --build --wait
      - name: Playwright
        working-directory: e2e
        env:
          FICHIERS: ${{ needs.e2e-selection.outputs.fichiers }}
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium firefox
          if [ "$FICHIERS" = "tout" ]; then FICHIERS=""; fi
          npx playwright test --shard=${{ matrix.partie }}/3 $FICHIERS
      - name: Logs des containers
        if: failure()
        run: $COMPOSE logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright-${{ matrix.partie }}
          path: e2e/playwright-report
          retention-days: 7

  # Nom conservé : c'est le contrôle exigé avant de merger une PR
  e2e:
    name: E2E (Chromium + Firefox)
    needs: [e2e-selection, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Résultat
        run: |
          echo "sélection : ${{ needs.e2e-selection.result }}, tests : ${{ needs.e2e-tests.result }}"
          [ "${{ needs.e2e-selection.result }}" = "success" ] && { [ "${{ needs.e2e-tests.result }}" = "success" ] || [ "${{ needs.e2e-tests.result }}" = "skipped" ]; }

  backup:
    name: Sauvegardes
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -p abatelier-ci -f compose.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Secrets jetables
        run: ./scripts/init-secrets.sh
      - name: Base, API et container de sauvegarde
        run: $COMPOSE up -d --build --wait db api backup
      - name: Sauvegarder, vérifier, perdre les données, restaurer
        run: |
          BK="$COMPOSE exec -T backup /bin/sh /opt/backup/backup.sh"
          Q="$COMPOSE exec -T db psql -U abatelier -d abatelier -Atc"

          $BK now ci
          $COMPOSE exec -T -e BACKUP_VERIFY_STRICT=1 backup /bin/sh /opt/backup/backup.sh verify

          avant=$($Q "select count(*) from users")
          $Q "delete from users"
          f=$($BK list | grep -o 'abatelier-[^ ]*-ci.dump' | head -1)
          $BK check "$f"
          $BK restore "$f"
          apres=$($Q "select count(*) from users")
          if [ "$avant" != "$apres" ] || [ "$apres" -lt 1 ]; then
            echo "::error::Restauration incomplète : $avant utilisateur(s) avant, $apres après."
            exit 1
          fi
          echo "✓ $apres utilisateur(s) retrouvé(s) après restauration"

          # Un fichier abîmé doit être refusé avant toute restauration
          $COMPOSE exec -T backup sh -c "echo abime >> /backups/daily/$f"
          if $BK check "$f"; then
            echo "::error::Un fichier de sauvegarde abîmé a été accepté."
            exit 1
          fi
          echo "✓ Fichier abîmé refusé"
      - name: Logs des containers
        if: failure()
        run: $COMPOSE logs --no-color

  facturx:
    name: Factures électroniques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: cd api && npm ci
      # Le validateur officiel Mustang contrôle le PDF/A-3, le XML Factur-X et les règles EN 16931 et françaises
      - name: Validation Factur-X
        run: ./scripts/facturx/valider.sh

  security:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Failles dans les dépendances
        run: |
          status=0
          for d in api web e2e; do
            echo "::group::$d"
            # Production : aucune faille haute ou critique tolérée. Outils de dev : aucune critique.
            (cd $d && npm audit --omit=dev --audit-level=high && npm audit --audit-level=critical) || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Aucun secret dans l'historique Git
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner -v
